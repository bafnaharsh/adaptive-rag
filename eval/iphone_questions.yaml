# Real-world test questions for the iPhone manuals corpus (data/manuals/*.pdf, see eval/SOURCES.md).
# pages are 1-based PHYSICAL PDF pages; for iphone_user_guide.pdf these equal the printed page numbers.
# doc/hybrid keywords are verified against the page text by eval/check_questions.py.
# web-question keywords are a snapshot of 2026-11-06 and will go stale; knowledge/web keywords are not page-checked.

# ---- doc: iPhone User Guide (iOS 8.4), early -> late pages ----
- id: ug_wifi
  question: How do I connect my iPhone to a Wi-Fi network?
  category: doc
  expected_tiers: [rag, hybrid]
  doc: iphone_user_guide.pdf
  pages: [16]
  keywords: ["Settings > Wi-Fi", "Choose a network"]

- id: ug_control_center
  question: How do I open Control Center on my iPhone?
  category: doc
  expected_tiers: [rag, hybrid]
  doc: iphone_user_guide.pdf
  pages: [35]
  keywords: ["Open Control Center", "bottom edge"]

- id: ug_lost_iphone
  question: I lost my iPhone, what can Find My iPhone do to help me?
  category: doc
  expected_tiers: [rag, hybrid]
  doc: iphone_user_guide.pdf
  pages: [46]
  keywords: ["Lost Mode", "Play Sound", "Erase iPhone"]

- id: ug_burst
  question: How do I take burst photos with the iPhone camera?
  category: doc
  expected_tiers: [rag, hybrid]
  doc: iphone_user_guide.pdf
  pages: [94]
  keywords: ["Burst", "Take Picture button"]

- id: ug_screenshot
  question: How do I take a screenshot of what is on my iPhone screen?
  category: doc
  # The guide (iOS 8.4) only covers Home-button iPhones; the indexed repair manual is iPhone 16 (no Home button),
  # so also fetching the current method from the web is correct. The guide page must still be cited.
  expected_tiers: [rag, hybrid, web]
  doc: iphone_user_guide.pdf
  pages: [96]
  keywords: ["screenshot", "Home buttons"]

- id: ug_force_restart
  question: How do I force restart my iPhone when it will not turn off?
  category: doc
  # The guide (iOS 8.4) only covers Home-button iPhones; the indexed repair manual is iPhone 16 (no Home button),
  # so also fetching the current method from the web is correct. The guide page must still be cited.
  expected_tiers: [rag, hybrid, web]
  doc: iphone_user_guide.pdf
  pages: [187]
  keywords: ["Reset iPhone", "Home button", "ten seconds"]

